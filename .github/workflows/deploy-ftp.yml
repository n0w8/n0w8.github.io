# Baut die Astro-Seite und lädt sie per FTP auf Mikes easyname-Webspace hoch
# (Ordner /nordweg-blog/ -> blog.nordwaldrecords.com). Läuft automatisch nach jedem
# veröffentlichten Artikel - auch bei ausgeschaltetem PC. Zugangsdaten liegen als
# GitHub-Secrets im Tresor (FTP_USERNAME / FTP_PASSWORD), nie im Code.
# Inkrementeller Sync: nur geänderte Dateien werden übertragen.
name: Deploy via FTP (easyname)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-ftp.yml'
  workflow_dispatch: {}

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Ensure native deps built
        run: npm rebuild sharp esbuild

      - name: Build
        run: npm run build

      # 3 Versuche - easyname timeoutet gelegentlich auf Port 21 (ETIMEDOUT).
      # Ohne Wiederholung bleibt eine Aenderung stillschweigend offline.
      - name: FTP sync to easyname (Versuch 1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: e111595-ftp.services.easyname.eu
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: nordweg-blog/

      - name: Pause vor Versuch 2
        if: steps.ftp1.outcome == 'failure'
        run: sleep 90

      - name: FTP sync to easyname (Versuch 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: e111595-ftp.services.easyname.eu
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: nordweg-blog/

      - name: Pause vor Versuch 3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 240

      - name: FTP sync to easyname (Versuch 3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: e111595-ftp.services.easyname.eu
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: nordweg-blog/

      # ENDGUELTIGES URTEIL: nicht der FTP-Schritt entscheidet ueber rot/gruen,
      # sondern die Live-Seite.
      #
      # Warum (4.10.2026): Die FTP-Action fuehrt am Ende Loeschungen aus. Ist
      # ein Ordner bei einem frueheren Versuch bereits geloescht worden, bricht
      # sie mit "550 No such file or directory" ab - obwohl ALLE Dateien
      # erfolgreich oben sind. Genau das ist heute passiert: der komplette
      # Inhalt war live, der Lauf trotzdem rot, und Mike bekommt fuer so etwas
      # eine Fehlermail, die er ausdruecklich nicht will.
      #
      # Darum wird jetzt geprueft, ob die Seite den SOEBEN gebauten Stand
      # ausliefert. Als Beweis dient der Dateiname des CSS-Buendels: Astro
      # haengt einen Inhalts-Hash an, der Name aendert sich also bei jeder
      # Aenderung. Ist diese Datei live erreichbar, ist der Deploy angekommen.
      # Ist sie es nicht, faellt der Lauf rot aus - echte Fehler bleiben sichtbar.
      - name: Live-Kontrolle (entscheidet ueber rot/gruen)
        run: |
          CSS=$(find dist/_astro -name "*.css" | head -1 | sed 's|^dist||')
          if [ -z "$CSS" ]; then echo "Kein CSS-Buendel gefunden - ueberspringe Pruefung."; exit 0; fi
          echo "Suche live nach: $CSS"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" "https://blog.nordwaldrecords.com$CSS?cb=$(date +%s)")
            HOME_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "https://blog.nordwaldrecords.com/?cb=$(date +%s)")
            echo "Versuch $i: CSS -> $CODE | Startseite -> $HOME_CODE"
            if [ "$CODE" = "200" ] && [ "$HOME_CODE" = "200" ]; then
              echo "Der aktuelle Stand ist live."
              exit 0
            fi
            sleep 30
          done
          echo "FEHLER: Der neue Stand ist nach dem Deploy nicht live erreichbar."
          exit 1
